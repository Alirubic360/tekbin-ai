<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Page not found | Tekbin AI</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#050505;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
  p.code{margin:0;font-size:14px;color:#4da3ff}
  h1{margin:12px 0 0;font-size:clamp(32px,6vw,48px);font-weight:600;letter-spacing:-0.02em}
  p.msg{margin:16px 0 0;color:rgba(255,255,255,.65)}
  .links{margin-top:32px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a{display:inline-flex;align-items:center;height:44px;padding:0 24px;border-radius:999px;font-size:14px;font-weight:500;text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.18)}
  a.primary{background:#0070f3;border-color:#0070f3}
  a:focus-visible{outline:2px solid #4da3ff;outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>Page not found</h1>
  <p class="msg">The page you are looking for does not exist or has moved.</p>
  <p class="msg" lang="fa" dir="rtl">صفحه‌ای که دنبالش هستید وجود ندارد یا جابه‌جا شده است.</p>
  <div class="links">
    <a class="primary" href="/">Home</a>
    <a href="/fa" lang="fa">صفحه‌ی اصلی فارسی</a>
  </div>
</main>
</body>
</html>
